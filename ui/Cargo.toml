[package]
name = "podbag-ui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "The UI layer of Podbag Desktop"

[dependencies]
winit = "=0.30.13"
# Default features minus `webgpu` (browser target only).
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "dx12", "vulkan", "gles"] }
glyphon = "=0.12.0"
arboard = { version = "=3.7.0", default-features = false }
pollster = "=0.4.0"
unicode-segmentation = "=1.12.0"
# Icon rasterizer (SVG path data, strokes); already in the tree through swash.
zeno = "=0.3.3"
# Script names for the CJK font fallback; already in the tree through cosmic-text.
unicode-script = "=0.5.9"
# PNG decoding for images (pure Rust; already in the tree).
png = "0.18"

# The Dock icon's reopen event, which winit does not report.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Wayland's clipboard protocol, with X11 as the fallback.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }
