[package]
name = "openpod"
version = "0.1.0"
edition = "2024"
description = "Daemonless, rootless container engine in a single static binary"

[lib]
path = "src/lib.rs"

[[bin]]
name = "openpod"
path = "src/bin/openpod/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "mount", "pipe", "process", "system", "thread"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
