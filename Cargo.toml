[package]
name = "podbag"
version = "0.1.0"
edition = "2024"
description = "A container engine with no daemon, in one static binary, that stores images file by file"
license = "Apache-2.0"
repository = "https://github.com/SteelCrab/podbag"
homepage = "https://podbag.dev"
readme = "README.md"
keywords = ["container", "docker", "oci", "rootless", "wsl"]
categories = ["command-line-utilities", "virtualization"]
include = ["/src/**", "/build.rs", "/README.md", "/LICENSE"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "podbag"
path = "src/bin/podbag/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]
# macOS: the binary carries the VM's guest files from target/vm (or PODBAG_GUEST_DIR),
# built first with `dev/vm.sh run dev/macos/build-guest.sh`.
embed-guest = []
# Windows: podbag.exe carries the static Linux podbag (PODBAG_LINUX_BIN, same CPU) that it
# installs in its WSL2 distribution.
embed-linux = []

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9"
tar = { version = "0.4", default-features = false }
sha2 = "0.11"
httparse = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# The CRI messages (`podbag cri serve`).
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
# Inflate with a preset dictionary, for SPDY header blocks (already used by flate2).
miniz_oxide = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "mount", "pipe", "process", "system", "thread"] }

# The macOS front end: Virtualization.framework for the Linux VM.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-virtualization = "0.3.2"
block2 = "0.6"
dispatch2 = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
