[package]
name = "podbag"
version = "0.1.0"
edition = "2024"
description = "Daemonless, rootless container engine in a single static binary"

[lib]
path = "src/lib.rs"

[[bin]]
name = "podbag"
path = "src/bin/podbag/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]
# macOS: the binary carries the VM's guest files from target/vm (or PODBAG_GUEST_DIR),
# built first with `dev/vm.sh run dev/macos/build-guest.sh`.
embed-guest = []

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9"
tar = { version = "0.4", default-features = false }
sha2 = "0.11"
httparse = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "mount", "pipe", "process", "system", "thread"] }

# The macOS front end: Virtualization.framework for the Linux VM.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-virtualization = "0.3.2"
block2 = "0.6"
dispatch2 = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
