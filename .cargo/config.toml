[target.aarch64-linux-android]
linker = "aarch64-linux-android24-clang"
# Also run on devices with 16 KiB memory pages when building with NDK r27.
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384,-z,common-page-size=16384"]

# Use the same Android API level for native dependencies such as ring.
[env]
CC_aarch64_linux_android = "aarch64-linux-android24-clang"
AR_aarch64_linux_android = "llvm-ar"
