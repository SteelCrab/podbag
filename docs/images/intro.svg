<rect x="204" y="218" height="22" rx="4" fill="#5b5a55" width="0"><animate attributeName="width" dur="26.0s" repeatCount="indefinite" keyTimes="0.0000;0.4885;0.5346;1.0000" values="0;0;470.0;470.0"/></rect>
<g opacity="0"><animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" keyTimes="0.0000;0.5385;0.5442;0.7112;0.7115;1.0000" values="0;0;1;1;0;0"/><text x="684.0" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#f0efec" text-anchor="start">2,970 MiB</text></g>
<text x="110" y="290" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#f0efec" font-weight="600" text-anchor="start">Page cache to start them</text>
<text x="190" y="326" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9a998f" text-anchor="end">podbag</text>
