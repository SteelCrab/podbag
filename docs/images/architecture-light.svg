<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486" role="img" aria-label="Docker Engine runs two daemons and a shim per container and stores images as layers; podbag runs no daemon, one keeper per user while containers run, and stores images as files" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Docker Engine and podbag on Linux: processes and image storage</title>
<rect width="760" height="486" rx="10" fill="#fcfcfb"/>
<text x="30" y="38" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Docker Engine</text>
<text x="30" y="57" font-size="12" fill="#52514e" text-anchor="start">a client and two daemons</text>
<rect x="30" y="76" width="320" height="40" rx="7" fill="#f2f1ed" stroke="#c3c2b7"/>
<text x="44" y="101.0" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="start">docker CLI</text>
<line x1="70" y1="116" x2="70" y2="139" stroke="#898781" stroke-width="1.5"/>
<polygon points="65,138 75,138 70,146" fill="#898781"/>
<text x="82" y="135.0" font-size="11.5" fill="#52514e" text-anchor="start">API on /var/run/docker.sock</text>
<rect x="30" y="146" width="320" height="44" rx="7" fill="#f2f1ed" stroke="#c3c2b7"/>
<text x="44" y="173.0" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="start">dockerd</text>
<rect x="226" y="158.0" width="114" height="20" rx="10" fill="#2a78d6" stroke="#2a78d6"/>
<text x="283.0" y="172.0" font-size="11" fill="#ffffff" text-anchor="middle">always running</text>
<line x1="70" y1="190" x2="70" y2="211" stroke="#898781" stroke-width="1.5"/>
<polygon points="65,210 75,210 70,218" fill="#898781"/>
<text x="82" y="208.0" font-size="11.5" fill="#52514e" text-anchor="start">gRPC</text>
<rect x="30" y="218" width="320" height="44" rx="7" fill="#f2f1ed" stroke="#c3c2b7"/>
<text x="44" y="245.0" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="start">containerd</text>
<rect x="226" y="230.0" width="114" height="20" rx="10" fill="#2a78d6" stroke="#2a78d6"/>
<text x="283.0" y="244.0" font-size="11" fill="#ffffff" text-anchor="middle">always running</text>
<line x1="70" y1="262" x2="70" y2="283" stroke="#898781" stroke-width="1.5"/>
<polygon points="65,282 75,282 70,290" fill="#898781"/>
<text x="82" y="280.0" font-size="11.5" fill="#52514e" text-anchor="start">starts one per container</text>
<rect x="30" y="290" width="320" height="44" rx="7" fill="#f2f1ed" stroke="#c3c2b7"/>
<text x="44" y="317.0" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="start">containerd-shim</text>
<rect x="205" y="302.0" width="135" height="20" rx="10" fill="none" stroke="#2a78d6"/>
<text x="272.5" y="316.0" font-size="11" fill="#2a78d6" text-anchor="middle">one per container</text>
<line x1="70" y1="334" x2="70" y2="355" stroke="#898781" stroke-width="1.5"/>
<polygon points="65,354 75,354 70,362" fill="#898781"/>
<text x="82" y="352.0" font-size="11.5" fill="#52514e" text-anchor="start">runc sets the container up, then exits</text>
<rect x="30" y="362" width="320" height="40" rx="7" fill="#f2f1ed" stroke="#c3c2b7"/>
<text x="44" y="387.0" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="start">container</text>
<text x="30" y="432" font-size="12" fill="#0b0b0b" text-anchor="start">Images: layers. A changed layer is stored again, whole:</text>
<text x="30" y="450" font-size="12" fill="#0b0b0b" text-anchor="start">a file in two layers is kept, and cached, twice.</text>
<text x="410" y="38" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">podbag</text>
<text x="410" y="57" font-size="12" fill="#52514e" text-anchor="start">one program, no daemon</text>
<rect x="410" y="76" width="320" height="44" rx="7" fill="#f2f1ed" stroke="#c3c2b7"/>
<text x="424" y="95" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="start">podbag</text>
<text x="424" y="112" font-size="11.5" fill="#52514e" text-anchor="start">the command is the engine</text>
<line x1="440" y1="120" x2="440" y2="355" stroke="#898781" stroke-width="1.5"/>
<polygon points="435,354 445,354 440,362" fill="#898781"/>
<text x="454" y="238.0" font-size="11.5" fill="#52514e" text-anchor="start">creates each container itself:</text>
<text x="454" y="253.0" font-size="11.5" fill="#52514e" text-anchor="start">namespaces, cgroups, seccomp</text>
<rect x="502" y="262" width="228" height="46" rx="7" fill="#f2f1ed" stroke="#c3c2b7"/>
<text x="516" y="281" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="start">keeper</text>
<text x="516" y="298" font-size="11.5" fill="#52514e" text-anchor="start">one per user, while containers run</text>
<line x1="616" y1="308" x2="616" y2="355" stroke="#898781" stroke-width="1.5"/>
<polygon points="611,354 621,354 616,362" fill="#898781"/>
<text x="628" y="339.0" font-size="11.5" fill="#52514e" text-anchor="start">logs, stop, wait</text>
<rect x="410" y="362" width="320" height="40" rx="7" fill="#f2f1ed" stroke="#c3c2b7"/>
<text x="424" y="387.0" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="start">container</text>
<text x="410" y="432" font-size="12" fill="#0b0b0b" text-anchor="start">Images: files. A file that many images share</text>
<text x="410" y="450" font-size="12" fill="#0b0b0b" text-anchor="start">is kept once and cached once.</text>
<text x="380.0" y="476" font-size="11.5" fill="#52514e" text-anchor="middle">With no container, Docker&#x27;s daemons keep running; podbag runs nothing.</text>
</svg>
