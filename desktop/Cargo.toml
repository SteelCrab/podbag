[package]
name = "podbag-desktop"
version = "0.3.2"
edition = "2024"
description = "podbag in a window: containers, images, volumes and networks, and a menu bar item"
license = "Apache-2.0"
repository = "https://github.com/SteelCrab/podbag"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "podbag-desktop"
path = "src/main.rs"

[features]
# Linux: the tray item, through GTK and libayatana-appindicator. Building it needs their
# development packages (libgtk-3-dev, libayatana-appindicator3-dev).
linux-tray = ["dep:tray-icon", "dep:gtk"]

[dependencies]
podbag-ui = { path = "../ui" }
# The mock backend serves previews (PODBAG_DESKTOP_MOCK=1) and the UI tests.
podbag-desktop-core = { path = "../desktop-core", features = ["mock"] }
serde_json = "1"

# The tray (menu bar) item and the macOS app menu.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = { version = "0.25", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["libappindicator"], optional = true }
gtk = { version = "0.18", optional = true }

# The Windows resources of podbag-desktop.exe (build.rs): rc.exe or mingw's windres.
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
# examples/lab_capture.rs
serde = { version = "1", features = ["derive"] }
