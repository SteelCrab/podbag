<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>VM storage settings test</title>
<iframe id="running" src="preview.html?view=settings&amp;lang=en" width="1000" height="700" title="Running VM"></iframe>
<iframe id="stopped" src="preview.html?view=settings&amp;lang=en&amp;vmStorage=stopped" width="1000" height="700" title="Stopped VM"></iframe>
<pre id="result">Running</pre>
<script>
"use strict";

const check = (condition, message) => { if (!condition) throw Error(message); };

async function until(read, message) {
  const deadline = performance.now() + 5000;
  for (;;) {
    const value = read();
    if (value) return value;
    check(performance.now() < deadline, message);
    await new Promise(resolve => setTimeout(resolve, 20));
  }
}

async function preview(id) {
  const frame = document.getElementById(id);
  await until(() => frame.contentDocument?.documentElement.dataset.ready === "1" &&
    frame.contentDocument.querySelector("#vm-storage-settings"), `Load the ${id} VM storage settings`);
  const doc = frame.contentDocument, win = frame.contentWindow;
  const by = name => doc.getElementById(name);
  const section = by("vm-storage-settings");
  const writes = () => win.previewVmStorageWrites || [];
  function set(name, value) {
    const input = by(name);
    input.value = value;
    input.dispatchEvent(new win.Event("input", { bubbles: true }));
    input.dispatchEvent(new win.Event("change", { bubbles: true }));
    return input;
  }
  return { doc, by, section, writes, set };
}

async function checkRunningVm(page) {
  const { by, section, writes } = page;
  section.open = true;
  await until(() => by("vm-storage-capacity").min === "65", "Load the running VM storage size");
  check(by("vm-storage-grow").matches(":disabled") && by("vm-storage-move").matches(":disabled"),
    "A running VM must disable size and location changes");
  by("vm-storage-grow").click();
  by("vm-storage-move").click();
  check(writes().length === 0, "Disabled controls must not send storage requests");
}

async function checkStoppedVm(page) {
  const { doc, by, section, writes, set } = page;
  const search = by("settings-search");
  check(!section.open, "The VM storage section starts closed");
  set("settings-search", "disk location");
  const result = await until(() => doc.querySelector('[data-setting-result="settings.vmStorage"]'),
    "Find VM storage by searching for disk location");
  result.click();
  check(section.open && !search.value, "Search opens the storage section and clears the query");
  check(doc.activeElement === section.querySelector("summary"), "Search focuses the storage heading");
  const grow = by("vm-storage-grow");
  await until(() => grow.matches(":enabled") && by("vm-storage-capacity").min === "65",
    "Enable changes for the stopped VM's 64 GiB disk");

  const unchanged = set("vm-storage-capacity", "64");
  check(unchanged.validity.rangeUnderflow, "Require an increase in disk capacity");
  grow.click();
  check(writes().length === 0, "Do not submit an unchanged capacity");
  set("vm-storage-capacity", "65");
  grow.click();
  const grown = await until(() => writes()[0], "Send the disk growth request");
  check(grown.action === "grow" && grown.gib === 65, "Send the requested disk size in GiB");

  const status = by("vm-storage-status");
  await until(() => by("vm-storage-capacity").min === "66" && status.textContent.includes("Recovery copy:"),
    "Show the grown capacity and the recovery copy");
  check(section.textContent.includes("Applies on the next start"), "Explain the remaining guest file system growth");

  const destination = "/Volumes/Work/podbag.img";
  const move = by("vm-storage-move");
  await until(() => move.matches(":enabled"), "Enable relocation after growing the disk");
  set("vm-storage-path", destination);
  move.click();
  const moved = await until(() => writes()[1], "Send the disk move request");
  check(moved.action === "move" && moved.path === destination, "Send the requested absolute disk path");
  check(writes().length === 2, "Send each storage request once");
  await until(() => section.querySelector(".fields").textContent.includes(destination)
    && status.textContent.includes("Recovery copy: /Users/sam/.podbag/disk.img"),
    "Show the new disk path and the old disk kept as a recovery copy");
}

async function test() {
  const [running, stopped] = await Promise.all([preview("running"), preview("stopped")]);
  await checkRunningVm(running);
  await checkStoppedVm(stopped);
}
const result = document.getElementById("result");
test().then(() => { result.textContent = "PASS: Search VM storage, gate writes, grow the disk, and move it"; },
  error => { result.textContent = "FAIL: " + error.message; });
</script>
</html>
