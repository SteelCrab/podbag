<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Buildx builder settings test</title>
<iframe id="app" src="preview.html?view=settings&amp;lang=en" width="1000" height="700" title="Desktop settings"></iframe>
<iframe id="missing" src="preview.html?view=settings-builders&amp;builders=missingBuildx&amp;lang=ko" width="1000" height="700" title="Buildx plugin unavailable"></iframe>
<pre id="result">Running</pre>
<script>
"use strict";
const check = (condition, message) => { if (!condition) throw Error(message); };
async function until(read, message) {
  const deadline = performance.now() + 5000;
  for (;;) {
    const value = read();
    if (value) return value;
    check(performance.now() < deadline, message);
    await new Promise(resolve => setTimeout(resolve, 20));
  }
}
async function test() {
  const frame = document.getElementById("app");
  const input = await until(() => frame.contentDocument?.getElementById("settings-search"), "Settings loaded");
  const doc = input.ownerDocument, win = frame.contentWindow;
  input.value = "BuildKit";
  input.dispatchEvent(new win.Event("input", { bubbles: true }));
  const hit = doc.querySelector('#settings-search-results [data-setting-result="settings.builders"]');
  check(hit, "BuildKit search exposes the Builders settings");
  hit.click();
  const section = doc.getElementById("builder-settings");
  check(section.open && doc.activeElement === section.querySelector("summary"), "Search opens and focuses Builders");
  const by = selector => section.querySelector(selector);
  const row = name => by(`[data-builder="${name}"]`);
  const controls = label => [...section.querySelectorAll(".builder-actions button")].find(button => button.textContent === label);
  await until(() => row("podbag"), "The scoped catalog appears");
  check(by(".builder-toolbar .hint").textContent.includes("podbag"), "Show the selected Docker context");
  check(row("podbag").querySelector(".builder-current"), "Show the active builder");
  row("podbag").click();
  await until(() => controls("Use builder"), "Inspect the built-in builder");
  check(!controls("Start") && !controls("Stop") && !controls("Remove"), "Protect the built-in Docker builder");

  row("ci-builder").click();
  await until(() => controls("Stop"), "Inspect the running container builder");
  check(by(".builder-node").textContent.includes("v0.33.1"), "Show status and BuildKit version");
  controls("Use builder").click();
  await until(() => row("ci-builder").querySelector(".builder-current") && controls("Stop") && !controls("Stop").disabled, "Select the builder within this context");
  controls("Stop").click();
  await until(() => controls("Start") && !controls("Start").disabled, "Stop the selected container builder");
  controls("Start").click();
  await until(() => controls("Stop") && !controls("Stop").disabled, "Start the container builder again");
  controls("Remove").click();
  const confirm = doc.getElementById("confirm");
  check(confirm.open && confirm.textContent.includes("cache"), "Warn about deleting the build cache");
  const cancelled = new Promise(resolve => confirm.addEventListener("close", resolve, { once: true }));
  doc.getElementById("confirm-cancel").click();
  await cancelled;
  check(row("ci-builder"), "Cancellation preserves the builder");
  controls("Remove").click();
  doc.getElementById("confirm-yes").click();
  await until(() => !row("ci-builder") && row("podbag").querySelector(".builder-current"), "Refresh the list after removal");

  const missing = document.getElementById("missing");
  await until(() => missing.contentDocument?.querySelector(".builder-status")?.textContent.includes("Buildx 플러그인"),
    "Localize the message when the Docker plugin is unavailable");
}
test().then(() => { document.getElementById("result").textContent = "PASS"; }, (error) => {
  document.getElementById("result").textContent = "FAIL: " + error.message;
});
</script>
</html>
