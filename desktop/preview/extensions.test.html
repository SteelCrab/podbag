<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Desktop extension lifecycle test</title>
<iframe id="preview" src="preview.html?view=extensions&amp;lang=en" width="940" height="660" title="Extensions manager"></iframe>
<pre id="result">Running</pre>
<script>
"use strict";

const check = (condition, message) => { if (!condition) throw Error(message); };
async function until(predicate, message) {
  const deadline = performance.now() + 5000;
  while (!predicate()) {
    check(performance.now() < deadline, message);
    await new Promise((resolve) => setTimeout(resolve, 20));
  }
}

async function test() {
  const frame = document.getElementById("preview");
  const doc = () => frame.contentDocument;
  const win = frame.contentWindow;
  const button = (label) => [...doc().querySelectorAll("#main button")].find((item) => item.textContent.trim() === label);
  const summary = () => doc().querySelector("#extension-counts");

  await until(() => button("Install manifest") && !button("Install manifest").disabled, "The extension manager did not load");
  check(win.previewExtensionActions.every((request) => request.action === "list"), "Opening Extensions only lists installed manifests");

  const sample = JSON.stringify({
    apiVersion: 1, id: "test.workspace", name: "Workspace notes", version: "1.0",
    description: "Review containers before changes.", permissions: ["engineSummary"],
    content: [
      { type: "text", text: "<b>Display this literally</b>" },
      { type: "code", text: "<script>window.previewManifestExecuted = true;<" + "/script>" },
      { type: "engineSummary" },
    ],
  });
  const input = doc().querySelector('#main input[type="file"]');
  const transfer = new win.DataTransfer();
  transfer.items.add(new win.File([sample], "workspace.json", { type: "application/json" }));
  input.files = transfer.files;
  input.dispatchEvent(new win.Event("change", { bubbles: true }));
  await until(() => button("Enable"), "The selected file was not installed");
  check(win.previewExtensionActions.at(-1).source === sample, "Only file contents go to the app");
  check(!doc().querySelector(".extension-content") && !summary(), "Installation leaves the extension disabled");

  button("Enable").click();
  await until(() => doc().querySelector(".extension-content"), "Enabling did not open the view");
  const content = doc().querySelector(".extension-content");
  check(content.textContent.includes("<b>Display this literally</b>"), "Render extension text literally");
  check(!content.querySelector("b, script, iframe") && !win.previewManifestExecuted, "Never inject extension HTML or scripts");
  check(!summary(), "Enable does not grant engine access");
  doc().querySelector(".extension-permission input").click();
  await until(() => summary()?.textContent.includes("Containers"), "The explicit grant did not display counts");
  check(summary().querySelectorAll("dd").length === 4, "Show only approved resource counts");

  button("Disable").click();
  await until(() => button("Enable") && !button("Enable").disabled, "The extension was not disabled");
  check(!doc().querySelector(".extension-content"), "Hide disabled content");
  button("Enable").click();
  await until(() => button("Disable") && !button("Disable").disabled, "The extension was not re-enabled");
  check(!summary() && !doc().querySelector(".extension-permission input").checked, "Disabling clears the grant");

  button("Remove").click();
  await until(() => doc().querySelector("#confirm[open]"), "Removal needs confirmation");
  doc().getElementById("confirm-yes").click();
  await until(() => !button("Enable") && !button("Disable"), "The extension was not removed");
}

const result = document.getElementById("result");
test().then(() => { result.textContent = "PASS"; },
  (error) => { result.textContent = "FAIL: " + error.message; });
</script>
</html>
