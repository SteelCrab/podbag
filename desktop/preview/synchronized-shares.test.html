<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Synchronized shares test</title>
<iframe src="preview.html?view=settings-sync&amp;lang=en" width="960" height="720" title="Podbag Desktop"></iframe>
<pre id="result">Running</pre>
<script>
"use strict";
const frame = document.querySelector("iframe");
const result = document.querySelector("#result");
async function until(read) {
  for (let i = 0; i < 120; i++) {
    const value = read();
    if (value) return value;
    await new Promise(resolve => setTimeout(resolve, 25));
  }
  throw Error("Timed out waiting for synchronized share settings");
}
async function test() {
  const doc = frame.contentDocument;
  await until(() => doc.querySelector(".sync-share"));
  const name = doc.querySelector("#sync-share-name");
  const path = doc.querySelector("#sync-share-path");
  name.value = "second";
  path.value = "/Users/me/Second Project";
  doc.querySelector(".sync-share-form button[type=submit]").click();
  const row = await until(() => [...doc.querySelectorAll(".sync-share")].find(share => share.textContent.includes("podbag-sync-second")));
  const [sync] = row.querySelectorAll("button");
  sync.click();
  await until(() => !doc.querySelector(".sync-share-form button[type=submit]").disabled);
  // The list is replaced after every sync, so use the current row.
  const current = [...doc.querySelectorAll(".sync-share")].find(share => share.textContent.includes("podbag-sync-second"));
  current.querySelectorAll("button")[1].click();
  (await until(() => doc.querySelector("#confirm[open] #confirm-yes"))).click();
  await until(() => !doc.querySelector(".sync-share-list").textContent.includes("podbag-sync-second"));
  if (!doc.querySelector(".sync-share-list").textContent.includes("podbag-sync-project")) throw Error("The other share must remain");
}
frame.addEventListener("load", () => test().then(
  () => { result.textContent = "PASS: Add, run, and stop a synchronized share"; },
  error => { result.textContent = "FAIL: " + error.message; },
), { once: true });
</script>
