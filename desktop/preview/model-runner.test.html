<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Local model runner test</title>
<iframe id="local" src="preview.html?view=models&amp;lang=en" width="900" height="650" title="Local model runner"></iframe>
<iframe id="missing" src="preview.html?view=models&amp;ollama=missing&amp;lang=en" width="900" height="650" title="Missing Ollama"></iframe>
<pre id="result">Running</pre>
<script>
"use strict";

const check = (condition, message) => { if (!condition) throw Error(message); };
async function until(predicate, message) {
  const deadline = performance.now() + 5000;
  while (!predicate()) {
    check(performance.now() < deadline, message);
    await new Promise((resolve) => setTimeout(resolve, 20));
  }
}

async function preview(id) {
  const frame = document.getElementById(id);
  const doc = () => frame.contentDocument;
  await until(() => doc().querySelector(".model-runner") && !button("Start runner")?.disabled,
    "The model page did not load");
  function button(label) {
    return [...doc().querySelectorAll("#main button")].find((button) => button.textContent.trim() === label);
  }
  function submit(id, text) {
    const field = doc().getElementById(id);
    field.value = text;
    field.dispatchEvent(new frame.contentWindow.Event("input", { bubbles: true }));
    field.form.requestSubmit();
  }
  return { doc: doc(), win: frame.contentWindow, button, submit };
}

async function test() {
  const [local, missing] = await Promise.all([preview("local"), preview("missing")]);
  check(local.win.previewModelActions.every((request) => request.action === "status"), "Opening Models cannot start Ollama or download a model");
  local.button("Start runner").click();
  await until(() => local.button("Stop runner"), "The runner did not start");
  check(local.doc.querySelector(".model-runner").textContent.includes("No models installed."), "Show an empty inventory");
  local.submit("model-name", "smollm2:135m");
  await until(() => local.doc.querySelector(".models-table")?.textContent.includes("smollm2:135m"), "Show the downloaded model");
  local.submit("model-prompt", "Name a color.");
  await until(() => local.doc.querySelector(".model-answer pre")?.textContent === "Blue.", "Show the local response");
  check(local.doc.querySelector(".models-table").textContent.includes("Loaded"), "Refresh loaded model state");
  local.button("Unload").click();
  await until(() => local.doc.querySelector(".models-table").textContent.includes("Idle"), "Unload the model without deleting it");

  let finish;
  const invoke = local.win.__TAURI__.core.invoke;
  local.win.__TAURI__.core.invoke = (cmd, args) => cmd === "models" && args.request.action === "run"
    ? new Promise((resolve) => { finish = resolve; }) : invoke(cmd, args);
  local.submit("model-prompt", "Generate another color.");
  check(local.button("Run model").disabled, "Guard the run while a request is pending");
  local.button("Stop runner").click();
  await until(() => local.button("Start runner"), "Stop the runner during a pending generation");
  finish({ response: "Stale response" });
  await new Promise((resolve) => setTimeout(resolve, 20));
  check(!local.doc.querySelector(".model-answer"), "Ignore a result from a stopped runner");
  local.button("Start runner").click();
  await until(() => local.doc.querySelector(".models-table")?.textContent.includes("smollm2:135m"), "Keep downloaded models after restart");
  check(!local.doc.querySelector(".model-answer"), "A canceled generation cannot appear after restart");

  missing.button("Start runner").click();
  await until(() => missing.doc.querySelector('[role="alert"]')?.textContent.includes("Ollama was not found"), "Explain a missing backend");
  check(!missing.button("Start runner").disabled, "Allow a retry after a startup error");
}

const result = document.getElementById("result");
test().then(() => { result.textContent = "PASS"; },
  (error) => { result.textContent = "FAIL: " + error.message; });
</script>
</html>
