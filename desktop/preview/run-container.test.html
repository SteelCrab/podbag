<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Run container test</title>
<!-- One frame, one page at a time: a frame out of view is throttled, and its dialogs lag. -->
<iframe id="page" width="1000" height="720" title="Podbag Desktop"></iframe>
<pre id="result">Running</pre>
<script>
"use strict";
const check = (condition, message) => { if (!condition) throw Error(message); };

async function until(get, what) {
  const deadline = performance.now() + 5000;
  for (;;) {
    const value = get();
    if (value) return value;
    if (performance.now() >= deadline) throw Error(`Timed out: ${what}`);
    await new Promise((resolve) => setTimeout(resolve, 20));
  }
}

// Open the preview with `query` and wait until it is ready.
function frame(query) {
  const el = document.getElementById("page");
  return new Promise((resolve) => {
    el.addEventListener("load", async () => {
      await until(() => el.contentDocument?.documentElement?.dataset.ready === "1", `${query} ready`);
      resolve(el.contentWindow);
    }, { once: true });
    el.src = `preview.html?${query}&lang=en`;
  });
}

// Record what the page asks the engine to run.
function record(win) {
  const invoke = win.__TAURI__.core.invoke;
  const asked = [];
  win.__TAURI__.core.invoke = (cmd, args) => {
    if (cmd === "run_container") asked.push(JSON.parse(JSON.stringify(args.spec)));
    return invoke(cmd, args);
  };
  return asked;
}

function type(input, value) {
  input.value = value;
  input.dispatchEvent(new Event("input", { bubbles: true }));
}

// The form from the Containers page: bad input is named, good input is sent as it is.
async function runsFromTheForm() {
  const win = await frame("view=containers");
  const doc = win.document;
  const asked = record(win);
  await win.podbag.go("containers");
  const open = [...doc.querySelectorAll(".toolbar .button")].find((b) => b.textContent === "Run container");
  check(open, "Offer Run container on the Containers page");
  open.click();
  const d = await until(() => doc.querySelector("dialog#run-dialog[open]"), "the run form");
  const form = d.querySelector("form");
  const status = d.querySelector("#run-status");
  check(doc.activeElement === d.querySelector("#run-image"), "Focus the image first");
  check(!d.querySelector("details").open, "Keep the options closed at first");

  const submit = () => form.requestSubmit(d.querySelector("button[type=submit]"));
  submit();
  check(status.textContent === "Enter an image name without spaces, like nginx:alpine.", "Ask for the image: " + status.textContent);
  check(d.querySelector("#run-image").getAttribute("aria-invalid") === "true", "Mark the image field");

  type(d.querySelector("#run-image"), "nginx:alpine");
  type(d.querySelector("#run-name"), "web");
  type(d.querySelector(".run-host"), "8080");
  type(d.querySelector(".run-container"), "70000");
  submit();
  check(status.textContent === "A port is a number from 1 to 65535.", "Refuse a port that is too big: " + status.textContent);
  check(doc.activeElement === d.querySelector(".run-container"), "Focus the bad port");
  type(d.querySelector(".run-container"), "80");

  // A second port; a UDP one with no host port.
  d.querySelector("#run-ports ~ .run-add").click();
  const second = d.querySelectorAll("#run-ports .run-row")[1];
  check(doc.activeElement === second.querySelector(".run-host"), "Focus the new port row");
  type(second.querySelector(".run-container"), "53");
  second.querySelector(".run-protocol").value = "udp";

  d.querySelector("#run-env ~ .run-add").click();
  type(d.querySelector(".run-env"), "MODE");
  submit();
  check(d.querySelector("details").open, "Open the options to show the problem");
  check(status.textContent === "Write each variable as KEY=VALUE.", "Ask for KEY=VALUE: " + status.textContent);
  type(d.querySelector(".run-env"), "MODE=dev");

  d.querySelector("#run-volumes ~ .run-add").click();
  type(d.querySelector(".run-source"), "./site");
  type(d.querySelector(".run-target"), "/usr/share/nginx/html");
  submit();
  check(status.textContent.startsWith("Enter a volume name or a full host path"), "Refuse a relative path: " + status.textContent);
  type(d.querySelector(".run-source"), "site");
  d.querySelector(".run-readonly").checked = true;
  d.querySelector("#run-volumes ~ .run-add").click();
  const logs = d.querySelectorAll("#run-volumes .run-row")[1];
  type(logs.querySelector(".run-source"), "/Users/me/logs");
  type(logs.querySelector(".run-target"), "data");
  submit();
  check(status.textContent === "Enter a full path in the container, like /data.", "Refuse a relative container path");
  type(logs.querySelector(".run-target"), "/var/log/nginx");

  type(d.querySelector("#run-command"), "nginx -g 'daemon off;");
  submit();
  check(status.textContent === "A quote in the command is not closed.", "Find the open quote");
  type(d.querySelector("#run-command"), "nginx -g 'daemon off;'");
  d.querySelector("#run-restart").value = "always";
  const rm = d.querySelector("#run-rm");
  rm.click();
  check(d.querySelector("#run-restart").disabled && d.querySelector("#run-restart").value === "no",
    "Remove when it stops goes only with no restart");
  rm.click();
  d.querySelector("#run-restart").value = "unless-stopped";
  check(asked.length === 0, "Send nothing while the form has a problem");

  // Enter submits from a list too, not only from a text field.
  d.querySelector("#run-restart").dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
  // Chrome sends a dialog's close event with the next frame, which headless Chrome may
  // hold back: wait for the form to close, not to go.
  await until(() => !d.open, "the form to close");
  check(asked.length === 1, "Send one request");
  const want = {
    image: "nginx:alpine", name: "web",
    ports: [{ host: 8080, container: 80, protocol: "tcp" }, { host: 0, container: 53, protocol: "udp" }],
    env: ["MODE=dev"],
    volumes: [{ source: "site", target: "/usr/share/nginx/html", readOnly: true }, { source: "/Users/me/logs", target: "/var/log/nginx", readOnly: false }],
    command: ["nginx", "-g", "daemon off;"],
    restart: "unless-stopped", autoRemove: false,
  };
  check(JSON.stringify(asked[0]) === JSON.stringify(want), "Send the form as it is: " + JSON.stringify(asked[0]));
  await until(() => doc.querySelector(".tab[aria-selected=true]")?.textContent === "Logs", "the new container's logs");
  check(doc.querySelector(".toolbar h1").textContent === "web", "Open the new container");
  check(doc.getElementById("toasts").textContent.includes("Started web"), "Say that it started");
}

// Run on an image row: the image is filled in; Esc closes; a missing image is pulled.
async function runsAnImage() {
  const win = await frame("view=images");
  const doc = win.document;
  const asked = record(win);
  const row = [...doc.querySelectorAll(".list-images tbody tr")].find((tr) => tr.textContent.includes("alpine:3.22"));
  const run = row.querySelector("button[aria-label=Run]");
  check(run, "Offer Run on each image");
  run.click();
  let d = await until(() => doc.querySelector("dialog#run-dialog[open]"), "the run form");
  check(d.querySelector("#run-image").value === "alpine:3.22", "Fill in the image");
  check(doc.activeElement === d.querySelector("#run-name"), "Focus the name when the image is given");
  check(d.dispatchEvent(new win.Event("cancel", { cancelable: true })), "Let Esc close the form");
  d.close();

  run.click();
  d = await until(() => doc.querySelector("dialog#run-dialog[open]"), "the run form again");
  type(d.querySelector("#run-image"), "busybox:1.37");
  d.querySelector("#run-rm").checked = true;
  const lines = [];
  new win.MutationObserver(() => lines.push(d.querySelector("#run-status").textContent))
    .observe(d.querySelector("#run-status"), { childList: true, characterData: true, subtree: true });
  d.querySelector("form").requestSubmit(d.querySelector("button[type=submit]"));
  await until(() => !d.open, "the form to close after the pull");
  check(lines.some((l) => l.startsWith("Pulling busybox:1.37…")), "Show the pull: " + JSON.stringify(lines));
  check(asked[0].image === "busybox:1.37" && asked[0].autoRemove && asked[0].restart === "no" && asked[0].name === "",
    "Send the image, no name and auto-remove: " + JSON.stringify(asked[0]));
  await until(() => doc.querySelector(".tab[aria-selected=true]")?.textContent === "Logs", "the new container's logs");
}

// No containers: Run container is the first step; the terminal stays as another way.
async function emptyOffersRun() {
  const win = await frame("view=empty&tab=containers");
  const doc = win.document;
  const empty = await until(() => doc.querySelector(".empty"), "the empty page");
  const run = empty.querySelector(".empty-run");
  check(run && run.textContent === "Run container", "Offer Run container");
  check(empty.querySelector("code").textContent.includes("run -d"), "Still show the terminal command");
  run.click();
  check(doc.querySelector("dialog#run-dialog[open]"), "Open the form");
}

(async () => {
  const result = document.getElementById("result");
  try {
    await runsFromTheForm();
    await runsAnImage();
    await emptyOffersRun();
    result.textContent = "PASS";
  } catch (error) {
    result.textContent = "FAIL: " + error.message;
  }
})();
</script>
</html>
