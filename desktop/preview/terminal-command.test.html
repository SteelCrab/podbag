<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Terminal command notices test</title>
<iframe id="install" src="preview.html?view=cli-notice&amp;lang=en" width="900" height="560" title="Install notice"></iframe>
<iframe id="later" src="preview.html?view=cli-notice&amp;lang=en" width="900" height="560" title="Not now"></iframe>
<iframe id="update" src="preview.html?view=cli-update&amp;lang=en" width="900" height="560" title="Update notice"></iframe>
<pre id="result">Running</pre>
<script>
"use strict";
const check = (condition, message) => { if (!condition) throw Error(message); };

async function until(get, what) {
  const deadline = performance.now() + 5000;
  for (;;) {
    const value = get();
    if (value) return value;
    if (performance.now() >= deadline) throw Error(`Timed out: ${what}`);
    await new Promise((resolve) => setTimeout(resolve, 20));
  }
}

function frame(id) {
  const el = document.getElementById(id);
  return new Promise((resolve) => {
    const ready = () => el.contentDocument?.documentElement.dataset.ready === "1";
    const wait = async () => resolve(await until(ready, `${id} ready`).then(() => el.contentWindow));
    if (el.contentDocument?.readyState === "complete") wait();
    else el.addEventListener("load", wait, { once: true });
  });
}

// Install: the password dialog closed, an error, then the command is made.
async function installs() {
  const win = await frame("install");
  const doc = win.document;
  const notice = await until(() => doc.getElementById("cli-notice"), "the install notice");
  check(notice.textContent.includes("/usr/local/bin/podbag"), "Say where the command goes");
  const [later, install] = notice.querySelectorAll("button");
  check(later.textContent === "Not now" && install.textContent === "Install", "Offer Not now and Install");

  const invoke = win.__TAURI__.core.invoke;
  let answer = async () => null;
  win.__TAURI__.core.invoke = (cmd, args) => cmd === "install_terminal_command" ? answer() : invoke(cmd, args);
  install.click();
  await until(() => !install.disabled, "the canceled install");
  check(doc.getElementById("cli-notice") && install.textContent === "Install", "Keep the notice when no password was given");

  answer = async () => { throw "cannot make /usr/local/bin/podbag: Read-only file system"; };
  install.click();
  await until(() => notice.querySelector(".error-text").textContent, "the error");
  check(notice.querySelector(".error-text").textContent.includes("Read-only file system"), "Show why the install failed");

  answer = () => invoke("install_terminal_command", {});
  install.click();
  await until(() => !doc.getElementById("cli-notice"), "the notice to close");
  check(doc.getElementById("toasts").textContent.includes("Open a new terminal"), "Say how to use the command");
  await win.podbag.openSettingsSection("terminal-command");
  const section = doc.getElementById("terminal-command");
  check(section.querySelector(".setting-value").textContent === "This app's podbag", "Show the app's podbag in Settings");
  check(!section.querySelector(".setting-body button"), "Offer no second install");
}

// Not now: the notice goes and the answer is saved.
async function later() {
  const win = await frame("later");
  const doc = win.document;
  const notice = await until(() => doc.getElementById("cli-notice"), "the install notice");
  const invoke = win.__TAURI__.core.invoke;
  let saved;
  win.__TAURI__.core.invoke = (cmd, args) => {
    if (cmd === "set_settings") saved = args.settings;
    return invoke(cmd, args);
  };
  notice.querySelector("button").click();
  check(!doc.getElementById("cli-notice"), "Close the notice");
  check(saved && saved.cliNoticeDismissed === true, "Save Not now");
  check(doc.getElementById("toasts").textContent.includes("later in Settings"), "Say where to install later");
  await win.podbag.openSettingsSection("terminal-command");
  check(doc.querySelector("#terminal-command .setting-body button"), "Keep Install in Settings");
}

// An older separate podbag: Update brings it to the app's version.
async function updates() {
  const win = await frame("update");
  const doc = win.document;
  const notice = await until(() => doc.getElementById("cli-update-notice"), "the update notice");
  check(notice.textContent.includes("0.3.0") && notice.textContent.includes("0.3.1"), "Name both versions");
  const invoke = win.__TAURI__.core.invoke;
  let asked;
  win.__TAURI__.core.invoke = async (cmd, args) => {
    if (cmd === "upgrade") {
      asked = args.version;
      return { ok: true, code: 0, output: "", needsAdmin: false, command: null };
    }
    const answer = await invoke(cmd, args);
    // After the update, the terminal's podbag is the app's version.
    return cmd === "updates" && asked ? { ...answer, terminalVersion: asked, terminalOlder: false } : answer;
  };
  notice.querySelectorAll("button")[1].click();
  await until(() => !doc.getElementById("cli-update-notice"), "the update notice to close");
  check(asked === "0.3.1", "Update to the app's version");
  check(doc.getElementById("toasts").textContent.includes("now version 0.3.1"), "Say that it was updated");
  await new Promise((resolve) => setTimeout(resolve, 200));
  check(!doc.getElementById("cli-update-notice"), "Do not ask again after the update");
}

(async () => {
  const result = document.getElementById("result");
  try {
    await installs();
    await later();
    await updates();
    result.textContent = "PASS";
  } catch (error) {
    result.textContent = "FAIL: " + error.message;
  }
})();
</script>
</html>
