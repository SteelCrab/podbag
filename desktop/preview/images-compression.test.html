<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Compressed images in the Images view test</title>
<iframe id="en" src="preview.html?view=images&amp;lang=en" width="1100" height="560" title="Images, English"></iframe>
<iframe id="ko" src="preview.html?view=images&amp;lang=ko" width="1100" height="560" title="Images, Korean"></iframe>
<iframe id="off" src="preview.html?view=settings-docker&amp;lang=en" width="900" height="560" title="Settings, compression off"></iframe>
<iframe id="on" src="preview.html?view=settings-docker&amp;compression=idle&amp;lang=ko" width="900" height="560" title="Settings, compression on"></iframe>
<pre id="result">Running</pre>
<script>
"use strict";
const check = (condition, message) => { if (!condition) throw Error(message); };
const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

async function until(get, what) {
  const deadline = performance.now() + 5000;
  for (;;) {
    const value = get();
    if (value) return value;
    if (performance.now() >= deadline) throw Error(`Timed out: ${what}`);
    await pause(20);
  }
}

// In view: Chrome holds back a hidden frame's rendering.
function frame(id) {
  const el = document.getElementById(id);
  el.scrollIntoView();
  return new Promise((resolve, reject) => {
    const ready = () => el.contentDocument?.documentElement?.dataset.ready === "1";
    // A frame that never gets ready fails the test.
    const wait = () => until(ready, `${id} ready`).then(() => resolve(el.contentWindow), reject);
    if (el.contentDocument?.readyState === "complete") wait();
    else el.addEventListener("load", wait, { once: true });
  });
}

// The row of the image with this name, and its Size cell.
async function row(win, name) {
  const tr = await until(() => [...win.document.querySelectorAll(".list-images tbody tr")]
    .find((r) => r.querySelector(".col-name").textContent === name), `the row of ${name}`);
  return { tr, cell: tr.querySelector("td.col-size") };
}

// Type in the list's search box.
function search(win, text) {
  const box = win.document.querySelector(".toolbar input.search");
  box.value = text;
  box.dispatchEvent(new win.Event("input"));
}

// The details' value for this label, or null.
function detail(win, label) {
  const dt = [...win.document.querySelectorAll(".fields dt")].find((d) => d.textContent === label);
  return dt ? dt.nextElementSibling : null;
}

async function listAndDetails() {
  const win = await frame("en");
  const { tr, cell } = await row(win, "alpine:3.22");
  const mark = cell.querySelector('svg[role="img"]');
  check(mark && mark.querySelector('use[href="#i-compress"]'), "Show the compression icon");
  check(mark.getAttribute("aria-label") === "Compressed", "Name the icon for screen readers");
  check(mark.getAttribute("aria-hidden") !== "true", "Do not hide the icon from screen readers");
  const lines = cell.querySelectorAll(".size-line, .size-note");
  check(lines.length === 2, "Show two lines in the Size cell");
  check(lines[0].textContent === "3.9 MB", `Show the size on disk first (got ${lines[0].textContent})`);
  check(lines[1].textContent === "From 8.5 MB, 54% smaller", `Say how much smaller (got ${lines[1].textContent})`);
  check(lines[1].classList.contains("secondary-text"), "Mute the second line");
  const width = () => win.document.querySelector(".list-images th.col-size").getBoundingClientRect().width;
  check(width() > 150, `Widen the Size column for the second line (got ${width()})`);

  const plain = (await row(win, "nginx:alpine")).cell;
  check(plain.textContent === "52.4 MB", `Keep one line for a plain image (got ${plain.textContent})`);
  check(!plain.querySelector("svg") && !plain.querySelector(".size-note"), "No icon or note for a plain image");
  // Without a compressed row, the Size column keeps its old width.
  search(win, "nginx");
  await until(() => win.document.querySelectorAll(".list-images tbody tr").length === 1, "only nginx listed");
  check(Math.round(width()) === 110, `Keep the Size column at 110px (got ${width()})`);
  search(win, "");
  await until(() => win.document.querySelectorAll(".list-images tbody tr").length === 5, "all images listed");

  tr.querySelector("button.link").click();
  const value = await until(() => detail(win, "Compression"), "the Compression row");
  check(value.textContent.includes("Compressed: 3.9 MB (8.5 MB before)"), `Show both sizes (got ${value.textContent})`);
  check(value.textContent.includes("54% smaller"), "Show the ratio in the details");

  win.podbag.go("images");
  (await row(win, "nginx:alpine")).tr.querySelector("button.link").click();
  await until(() => detail(win, "Tags"), "the details of nginx");
  check(!detail(win, "Compression"), "No Compression row for a plain image");
}

async function korean() {
  const win = await frame("ko");
  const { cell } = await row(win, "alpine:3.22");
  check(cell.querySelector("svg").getAttribute("aria-label") === "압축됨", "Name the icon in Korean");
  const note = cell.querySelector(".size-note").textContent;
  check(/^8\.5\s?MB에서 54% 줄어듦$/.test(note), `Say how much smaller in Korean (got ${note})`);
}

// The note in Settings shows only while compression is on.
async function settingsNote() {
  const off = await frame("off");
  const toggle = await until(() => off.document.querySelector("#compression-switch:not(:disabled)"), "the switch");
  const note = off.document.getElementById("compression-images");
  check(note, "Have the Images view note");
  check(note.hidden, "Hide the note while compression is off");
  const described = () => toggle.getAttribute("aria-describedby").split(" ");
  check(!described().includes("compression-images"), "Do not describe the switch with a hidden note");
  toggle.click();
  await until(() => !note.hidden, "the note after turning on");
  check(described().includes("compression-hint") && described().includes("compression-images"), "Describe the switch with the note while it shows");
  check(note.textContent === "The Images view shows compressed images and how much smaller they got.", `Say where to look (got ${note.textContent})`);
  await until(() => !toggle.disabled, "the switch to settle");
  toggle.click();
  await until(() => note.hidden, "the note to hide after turning off");
  check(!described().includes("compression-images"), "Drop the note from the description when it hides");

  const on = await frame("on");
  const onToggle = await until(() => on.document.querySelector("#compression-switch:not(:disabled)"), "the switch (on)");
  const shown = on.document.getElementById("compression-images");
  await until(() => !shown.hidden, "the note while on");
  check(onToggle.checked, "Show the switch as on");
  check(shown.textContent === "이미지 화면에서 압축된 이미지와 줄어든 비율을 볼 수 있습니다.", `Say it in Korean (got ${shown.textContent})`);
}

let step = "";
(async () => {
  const result = document.getElementById("result");
  try {
    for (const test of [listAndDetails, korean, settingsNote]) {
      step = test.name;
      await test();
    }
    result.textContent = "PASS";
  } catch (error) {
    result.textContent = `FAIL (${step}): ${error.message}`;
  }
})();
</script>
</html>
