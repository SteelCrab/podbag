<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<base href="../ui/">
<title>podbag (preview)</title>
<link rel="stylesheet" href="style.css">
<!-- The page itself (ui/index.html), on a mocked API: see mock.js. -->
<script src="../preview/mock.js"></script>
</head>
<body>
<template id="page"></template>
<script>
  // Load ui/index.html's body, then its scripts, in order.
  fetch("index.html").then((r) => r.text()).then((html) => {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const scripts = [...doc.querySelectorAll("script")].map((s) => s.getAttribute("src"));
    doc.querySelectorAll("script").forEach((s) => s.remove());
    document.body.replaceChildren(...doc.body.childNodes);
    const next = () => {
      const src = scripts.shift();
      if (!src) return window.dispatchEvent(new Event("podbag-preview"));
      const s = document.createElement("script");
      s.src = src;
      s.onload = next;
      document.body.append(s);
    };
    next();
  });
</script>
</body>
</html>
