<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>OpenShift Routes test</title>
<iframe id="app" src="preview.html?view=pods&amp;lang=en" width="1000" height="600" title="Desktop preview"></iframe>
<pre id="result">Running</pre>
<script>
"use strict";
const check = (condition, message) => { if (!condition) throw Error(message); };

async function until(get, what) {
  const deadline = performance.now() + 5000;
  for (;;) {
    const value = get();
    if (value) return value;
    if (performance.now() >= deadline) throw Error(`Timed out: ${what}`);
    await new Promise((resolve) => setTimeout(resolve, 20));
  }
}

function frame(id) {
  const el = document.getElementById(id);
  return new Promise((resolve) => {
    const ready = () => el.contentDocument?.documentElement?.dataset.ready === "1";
    const wait = async () => resolve(await until(ready, `${id} ready`).then(() => el.contentWindow));
    if (el.contentDocument?.readyState === "complete") wait();
    else el.addEventListener("load", wait, { once: true });
  });
}

async function test() {
  const win = await frame("app");
  const doc = win.document;
  const byId = (id) => doc.getElementById(id);
  const invoke = win.__TAURI__.core.invoke;
  const calls = [];
  win.__TAURI__.core.invoke = (cmd, args) => {
    calls.push({ cmd, ...args });
    return invoke(cmd, args);
  };
  const lists = () => calls.filter((call) => call.cmd === "kube_list");
  const selectContext = (name) => {
    const cluster = byId("kube-context");
    cluster.value = name;
    cluster.dispatchEvent(new win.Event("change"));
  };
  const rows = () => [...doc.querySelectorAll(".kube-list tbody tr")];
  const cells = (row) => [...row.cells].map((cell) => cell.textContent);

  // A plain cluster: no Routes tab and no Routes in the sidebar.
  const tab = await until(() => byId("kube-routes"), "the Routes tab");
  await until(() => doc.querySelector(".kube-list"), "the Pods list");
  await new Promise((resolve) => setTimeout(resolve, 100));
  check(tab.hidden, "Hide Routes on a plain cluster");
  check(!byId("nav-kube-routes"), "Leave Routes out of the sidebar on a plain cluster");

  // The OpenShift context: the tab and the sidebar entry appear.
  await until(() => [...byId("kube-context").options].some((o) => o.value === "ocp"), "the context list");
  selectContext("ocp");
  await until(() => !tab.hidden, "the Routes tab on OpenShift");
  const nav = await until(() => byId("nav-kube-routes"), "the Routes sidebar entry");
  await until(() => nav.querySelector(".count").textContent === "2", "the Routes count");
  check(byId("nav-kube-open").querySelector(".count").textContent === "4", "Keep the total of the four kinds");

  tab.click();
  check(tab.getAttribute("aria-pressed") === "true", "Select the Routes tab");
  check(nav.getAttribute("aria-current") === "page", "Select Routes in the sidebar");
  await until(() => doc.querySelector(".kube-list[aria-label=Routes]"), "the Routes list");
  check(lists().at(-1).kind === "routes" && lists().at(-1).context === "ocp", "Read Routes from the OpenShift context");
  const headers = [...doc.querySelectorAll(".kube-list th")].map((th) => th.textContent);
  check(JSON.stringify(headers) === JSON.stringify(["Name", "Namespace", "Host", "Path", "Service", "TLS"]),
    `Show the Route columns, not ${headers}`);
  const [shop, api] = rows();
  check(rows().length === 2, "List the Routes of the namespace");
  check(JSON.stringify(cells(shop)) === JSON.stringify(["shop", "default", "shop.apps.ocp.example.com", "/cart", "frontend", "edge"]),
    `Show the Route fields, not ${cells(shop)}`);
  check(JSON.stringify(cells(api)) === JSON.stringify(["api", "default", "api.apps.ocp.example.com", "—", "api", "—"]),
    `Show a dash for no path and no TLS, not ${cells(api)}`);
  const link = shop.querySelector("a");
  check(link.getAttribute("href") === "https://shop.apps.ocp.example.com/cart", "Link to https with the path");
  check(api.querySelector("a").getAttribute("href") === "http://api.apps.ocp.example.com", "Link to http without TLS");

  link.click();
  await until(() => calls.some((call) => call.cmd === "kube_open_route"), "the open request");
  const open = calls.find((call) => call.cmd === "kube_open_route");
  check(open.context === "ocp" && open.namespace === "default" && open.name === "shop", "Open the Route by its name");
  check(!doc.querySelector("dialog.kube-inspect"), "Open the address without the inspect dialog");
  check(doc.location.href.includes("preview.html"), "Keep the app page open");

  // Back to a plain cluster from the Routes page: Pods, with no request for Routes.
  const count = lists().length;
  selectContext("dev");
  await until(() => byId("kube-pods").getAttribute("aria-pressed") === "true", "the fallback to Pods");
  await until(() => lists().length > count, "the Pods request");
  await new Promise((resolve) => setTimeout(resolve, 100));
  const after = lists().slice(count);
  check(after.every((call) => call.kind === "pods" && call.context === "dev"), "Load only Pods of the plain cluster");
  check(after.length === 1, "Load the Pods once");
  check(tab.hidden && !byId("nav-kube-routes"), "Hide Routes again");
  check(byId("nav-kube-pods").getAttribute("aria-current") === "page", "Select Pods in the sidebar");
  check(!doc.querySelector(".kube-tabs ~ * .error-text, .content .error-text"), "Show no error");
  await until(() => doc.querySelector(".kube-list")?.textContent.includes("worker-1"), "the Pods list");
}

(async () => {
  const result = document.getElementById("result");
  try {
    await test();
    result.textContent = "PASS";
  } catch (error) {
    result.textContent = "FAIL: " + error.message;
  }
})();
</script>
</html>
