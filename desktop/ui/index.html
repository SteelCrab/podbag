<div class="app" id="app">
  <header class="topbar" id="window-bar">
    <button type="button" class="icon-button" id="sidebar-toggle" aria-controls="sidebar" aria-expanded="true"></button>
    <button type="button" class="icon-button" id="nav-back" disabled></button>
    <button type="button" class="icon-button" id="nav-forward" disabled></button>
    <div class="topbar-space"></div>
    <div class="topbar-tools" id="topbar-tools" role="toolbar" aria-label="podbag" focusgroup="toolbar wrap"></div>
  </header>
  <nav class="sidebar" id="sidebar" aria-label="podbag">
    <ul class="nav" id="nav"></ul>
    <ul class="nav" id="nav-kubernetes"></ul>
    <div class="spacer"></div>
    <ul class="nav" id="nav-bottom"></ul>
    <section class="vm-card" id="vm-card" hidden></section>
    <div class="engine" id="engine" role="status"></div>
  </nav>
  <div class="splitter" id="splitter" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="sidebar" aria-valuemin="160" aria-valuemax="360" aria-valuenow="216"></div>
  <main id="main" tabindex="-1"></main>
  <div class="banner" id="banner" role="region" hidden></div>
  <footer class="statusbar" id="statusbar"></footer>
</div>

<dialog id="confirm" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="buttons">
      <button value="" class="button" id="confirm-cancel" autofocus></button>
      <button value="yes" class="button danger" id="confirm-yes"></button>
    </div>
  </form>
</dialog>

<dialog id="ask" aria-labelledby="ask-title">
  <form method="dialog" id="ask-form">
    <h2 id="ask-title"></h2>
    <label for="ask-input" id="ask-label"></label>
    <input id="ask-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    <p id="ask-progress" class="progress" aria-live="polite"></p>
    <div class="buttons">
      <button value="" class="button" id="ask-cancel" formnovalidate></button>
      <button value="ok" class="button primary" id="ask-ok"></button>
    </div>
  </form>
</dialog>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<script src="i18n.js"></script>
<script src="api.js"></script>
<script src="kubernetes.js"></script>
<script src="migration.js"></script>
<script src="app.js"></script>
<script src="images.js"></script>
</body>
</html>
