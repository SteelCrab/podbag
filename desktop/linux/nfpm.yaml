name: podbag-desktop
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
maintainer: pista <pista@firecrab.dev>
description: Manage containers, images, volumes and networks with Podbag Desktop.
homepage: https://podbag.dev
license: Apache-2.0
section: utils

contents:
  - src: ${BIN_DIR}/podbag-desktop
    dst: /usr/lib/podbag-desktop/podbag-desktop
    expand: true
    file_info:
      mode: 0755
  - src: ${BIN_DIR}/podbag
    dst: /usr/lib/podbag-desktop/podbag
    expand: true
    file_info:
      mode: 0755
  - src: /usr/lib/podbag-desktop/podbag-desktop
    dst: /usr/bin/podbag-desktop
    type: symlink
  - src: desktop/linux/podbag-desktop.desktop
    dst: /usr/share/applications/podbag-desktop.desktop
  - src: desktop/icons/128x128.png
    dst: /usr/share/icons/hicolor/128x128/apps/podbag-desktop.png
  - src: LICENSE
    dst: /usr/share/doc/podbag-desktop/LICENSE
  - src: desktop/linux/podbag-desktop-engine
    dst: /usr/share/podbag-desktop/podbag-desktop-engine
    packager: deb

# The app links GTK 3 (for the tray item) and loads the rest when it starts: the
# ayatana app indicator, xkbcommon, the X11 or Wayland client libraries, and EGL or
# Vulkan for drawing. A GPU driver (Mesa or the vendor's) comes with the desktop.
overrides:
  deb:
    depends:
      - libc6 (>= 2.36)
      - libgtk-3-0 | libgtk-3-0t64
      - libayatana-appindicator3-1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcursor1
      - libxi6
      - libwayland-client0
      - libwayland-egl1
      - libegl1
      - uidmap
      - passt
    recommends:
      - libegl-mesa0
      - libvulkan1
    scripts:
      postinstall: desktop/linux/postinst
      preremove: desktop/linux/prerm
  rpm:
    depends:
      - glibc >= 2.36
      - gtk3
      - libayatana-appindicator-gtk3
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libxcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - shadow-utils
      - passt
    recommends:
      - mesa-libEGL
      - vulkan-loader
    scripts:
      preremove: desktop/linux/rpm-preremove
