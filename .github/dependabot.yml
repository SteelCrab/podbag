version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/dev/cri/gen"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      cargo-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      workflow-dependencies:
        patterns: ["*"]
