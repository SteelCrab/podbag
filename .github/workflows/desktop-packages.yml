name: Linux desktop packages

on:
  pull_request:
    paths-ignore: ['README*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['README*.md', 'docs/**']
  workflow_dispatch:
  # The release workflow builds the packages of the tag and publishes them.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build packages (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        env:
          NFPM_VERSION: 2.48.0
        run: |
          apt-get update -qq
          # GTK 3 for the tray item; the app loads the rest at run time.
          apt-get install -y --no-install-recommends jq libgtk-3-dev
          cd /tmp
          url="https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION"
          deb="nfpm_${NFPM_VERSION}_$(dpkg --print-architecture).deb"
          curl -fsSLO "$url/$deb"
          curl -fsSLO "$url/checksums.txt"
          awk -v f="$deb" '$2 == f { print }' checksums.txt | sha256sum --check --strict -
          dpkg -i "$deb"
      - name: Build GUI and engine packages
        run: desktop/linux/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: podbag-desktop-${{ matrix.arch }}
          path: target/packages/
          if-no-files-found: error

  install:
    name: Install and launch (${{ matrix.system }}, ${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        system: ['debian:12', 'fedora:44']
        include:
          - { system: 'debian:12', name: debian-12 }
          - { system: 'fedora:44', name: fedora-44 }
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: podbag-desktop-${{ matrix.arch }}
          path: dist
      # The test tools and Mesa's software drivers (llvmpipe, lavapipe) belong to the test
      # container only: the runner has no GPU.
      - name: Install package and display tools
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends ./dist/*.deb
            apt-get install -y --no-install-recommends xvfb xauth xdotool dbus-daemon desktop-file-utils libglib2.0-bin curl \
              imagemagick libegl-mesa0 libgl1-mesa-dri mesa-vulkan-drivers
          else
            dnf install -y ./dist/*.rpm
            dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth xdotool dbus-daemon desktop-file-utils util-linux \
              ImageMagick mesa-dri-drivers mesa-libEGL mesa-vulkan-drivers
          fi
      - name: Open the installed application
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          useradd --create-home desktop-test
          install -d -o desktop-test shots
          runuser -u desktop-test -- dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1000x24' \
            sh desktop/linux/test-installed.sh "shots/podbag-desktop-${{ matrix.name }}-${{ matrix.arch }}.png"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: podbag-desktop-linux-screenshot-${{ matrix.name }}-${{ matrix.arch }}
          path: shots/
          if-no-files-found: warn
      - name: Remove package
        run: |
          # The podbag command that Install in the app makes.
          ln -s /usr/lib/podbag-desktop/podbag /usr/local/bin/podbag
          podbag --version
          if command -v apt-get >/dev/null; then
            apt-get purge -y podbag-desktop
          else
            dnf remove -y podbag-desktop
          fi
          test ! -L /usr/local/bin/podbag
          test ! -e /usr/bin/podbag-desktop
          test ! -e /usr/lib/podbag-desktop/podbag
          test ! -e /usr/share/applications/podbag-desktop.desktop
