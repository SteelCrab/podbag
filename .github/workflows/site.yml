name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "docs/media/**"
      - "dev/docs/site.py"
      - "dev/docs/storage.py"
      - "install.sh"
      - "Cargo.toml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the pages
        run: python3 dev/docs/site.py _site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install the Cloudflare CLI
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Deploy to podbag.dev
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: site
        run: npx cf deploy ../_site
      - name: No Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the site was built but not deployed."
