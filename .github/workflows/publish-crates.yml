name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of a published Podbag release (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: |
      (github.event_name == 'release' && !github.event.release.prerelease &&
        startsWith(github.event.release.tag_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable Podbag tag such as v0.3.0." >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease |
            jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false and .isPrerelease == false'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Use stable Rust
        run: rustup update stable --no-self-update
      - name: Verify the package version
        id: package
        run: |
          version=${RELEASE_TAG#v}
          cargo +stable metadata --locked --no-deps --format-version 1 |
            jq -e --arg version "$version" '.packages[] | select(.name == "podbag") | .version == $version'
          index=$(curl -fsSL --retry 3 https://index.crates.io/po/db/podbag)
          published=$(jq -cs --arg version "$version" 'any(.[]; .vers == $version)' <<< "$index")
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [[ "$published" == true ]]; then
            echo "podbag $version is already on crates.io."
          fi
      - name: Authenticate with crates.io
        if: steps.package.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the crate
        if: steps.package.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +stable publish --locked --registry crates-io -p podbag
