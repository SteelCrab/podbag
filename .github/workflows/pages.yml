name: Pages

# The website moved to https://podbag.dev (see site.yml). The old GitHub Pages address
# keeps working: its pages send readers to the same page on podbag.dev.

on:
  push:
    branches: [main]
    paths: ["dev/pages/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dev/pages
      - id: deployment
        uses: actions/deploy-pages@v5
