name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README*.md', 'docs/**']
  pull_request:
    paths-ignore: ['README*.md', 'docs/**']
  workflow_dispatch:
  # The release workflow runs CI on the tag and publishes its files.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-26.04 }
          - { arch: aarch64, runner: ubuntu-26.04-arm }
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Test the release installer
        run: sh tests/install.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
          components: rustfmt
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools uidmap passt erofs-utils jq
          # Rootless containers need user namespaces, which Ubuntu's AppArmor restricts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          for f in /etc/subuid /etc/subgid; do
            grep -q "^$USER:" "$f" || echo "$USER:100000:65536" | sudo tee -a "$f"
          done
      - run: cargo fmt --check
      - name: Test the release scripts
        run: sh tests/release.sh
      - name: Unit tests
        run: cargo test --lib --bins --test wsl
      - name: Static build
        run: |
          export "CC_${TARGET//-/_}=musl-gcc"
          cargo build --release --target "$TARGET"
          file "target/$TARGET/release/podbag"
      - name: Run containers
        run: |
          sudo install -m 0755 "target/$TARGET/release/podbag" /usr/local/bin/podbag
          podbag --version
          podbag check || true
          img=mirror.gcr.io/library/alpine:3.22
          sudo podbag run --rm "$img" echo root
          sudo podbag run --rm -v "$PWD:/src:ro" "$img" cat /src/Cargo.toml > /dev/null
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          podbag run --rm --network none "$img" echo rootless
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-${{ matrix.arch }}-linux
          path: target/${{ env.TARGET }}/release/podbag
          if-no-files-found: error

  android:
    name: Android aarch64
    runs-on: ubuntu-24.04
    env:
      TARGET: aarch64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - name: Build CLI with the Android NDK
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cargo build --locked --release --target "$TARGET" --bin podbag
          file "target/$TARGET/release/podbag" | grep -F 'interpreter /system/bin/linker64'
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-aarch64-android
          path: target/${{ env.TARGET }}/release/podbag
          if-no-files-found: error

  # The image store against the kernel: the store's integration tests and the library
  # tests that need root, rootless and as root. The container jobs run on Ubuntu 26.04:
  # rootless networks need pasta's --map-host-loopback, which 24.04's pasta lacks.
  integration:
    name: Integration ${{ matrix.mode }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        mode: [rootless, root]
    env:
      PODBAG_TEST_ROOT: ${{ matrix.mode == 'root' && '1' || '' }}
      PODBAG_TEST_ROOTFS: ${{ github.workspace }}/../alpine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Packages
        run: dev/ci/setup.sh
      - name: Test root filesystem
        run: dev/fetch-rootfs.sh "$PODBAG_TEST_ROOTFS"
      - name: Store tests
        timeout-minutes: 30
        run: cargo test --test store --test image_mount
      - name: Library tests as root
        if: matrix.mode == 'root'
        timeout-minutes: 15
        run: dev/root-lib-tests.sh

  # Real images and programs, compared with Docker: Python's .pyc files, cron, a damaged
  # file in the store, compressed images (containers, save, build, verify, decompress).
  e2e:
    name: E2E ${{ matrix.mode }} ${{ matrix.arch }}
    needs: linux
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        mode: [rootless, root]
    env:
      PODBAG_E2E_ROOT: ${{ matrix.mode == 'root' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: podbag-${{ matrix.arch }}-linux
          path: bin
      - name: Packages
        run: dev/ci/setup.sh
      - run: sudo install -m 0755 bin/podbag /usr/local/bin/podbag
      - name: Files, repair and compression
        timeout-minutes: 20
        run: tests/e2e/run.sh

  # nginx through podbag and through the docker CLI on podbag's Docker API.
  nginx:
    name: Nginx ${{ matrix.mode }} ${{ matrix.arch }}
    needs: linux
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        mode: [rootless, root]
    env:
      PODBAG_E2E_ROOT: ${{ matrix.mode == 'root' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: podbag-${{ matrix.arch }}-linux
          path: bin
      - name: Packages
        run: dev/ci/setup.sh
      - run: sudo install -m 0755 bin/podbag /usr/local/bin/podbag
      - name: nginx
        timeout-minutes: 10
        run: tests/e2e/nginx.sh

  windows:
    name: Windows ${{ matrix.arch }}
    needs: linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: windows-2025 }
          - { arch: aarch64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Clang for ring
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            $clang = Get-ChildItem -Recurse -Filter clang.exe -ErrorAction SilentlyContinue `
              -Path "C:\Program Files\Microsoft Visual Studio", "C:\Program Files\LLVM" |
              Select-Object -First 1
            if ($clang) { Add-Content $env:GITHUB_PATH $clang.DirectoryName }
          }
      - uses: actions/download-artifact@v4
        with:
          name: podbag-${{ matrix.arch }}-linux
          path: linux
      - name: Tests
        run: cargo test --test wsl --bin podbag
      - name: Build
        shell: pwsh
        run: |
          $env:PODBAG_LINUX_BIN = Join-Path $PWD "linux\podbag"
          cargo build --release --features embed-linux
          ./target/release/podbag.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-${{ matrix.arch }}-windows
          path: target/release/podbag.exe
          if-no-files-found: error
      - name: Test Windows desktop
        run: cargo test --locked -p podbag-desktop
      # The installer carries the engine built above, as target/windows-engine/podbag.exe.
      - name: Build Windows desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/windows-engine | Out-Null
          Copy-Item target/release/podbag.exe target/windows-engine/podbag.exe
          cargo build --locked --release -p podbag-desktop
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Package Windows desktop
        shell: pwsh
        run: ./desktop/windows/build-msi.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-desktop-${{ matrix.arch }}-windows
          path: target/msi/podbag-desktop-${{ matrix.arch }}-windows.msi
          if-no-files-found: error
      - name: Install and open Windows desktop
        shell: pwsh
        run: ./desktop/windows/test-installed.ps1 -Installer target/msi/podbag-desktop-${{ matrix.arch }}-windows.msi -Arch ${{ matrix.arch }}
      # 0.3.2 is the last Tauri-built installer: the new one must replace it in place.
      - name: Upgrade Windows desktop from 0.3.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.3.2 -R SteelCrab/podbag -p podbag-desktop-${{ matrix.arch }}-windows.msi -D target/previous --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download the 0.3.2 installer' }
          ./desktop/windows/test-installed.ps1 -Installer target/msi/podbag-desktop-${{ matrix.arch }}-windows.msi -Arch ${{ matrix.arch }} `
            -Previous target/previous/podbag-desktop-${{ matrix.arch }}-windows.msi `
            -Screenshot target/podbag-desktop-${{ matrix.arch }}-upgrade.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podbag-desktop-${{ matrix.arch }}-windows-screenshot
          path: target/podbag-desktop-${{ matrix.arch }}*.png
          if-no-files-found: warn

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - name: Test the release installer
        run: sh tests/install.sh
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  # The Macs' VM guests: a kernel and the static podbag, built on Linux of the same CPU.
  macos-guest:
    name: macOS VM guest ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-26.04 }
          - { arch: aarch64, runner: ubuntu-26.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - run: sudo apt-get update
      - name: Build the guest
        run: dev/macos/build-guest.sh
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-vm-guest-${{ matrix.arch }}
          path: |
            target/vm/Image
            target/vm/Image.zst
            target/vm/initramfs.gz
            target/vm/disk.zst
            target/vm/arch
          if-no-files-found: error

  # podbag on an Intel Mac: containers in a real Virtualization.framework VM, and the
  # release files (the CLI with its guest, and the desktop app).
  macos-intel:
    name: macOS Intel VM
    needs: macos-guest
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      PODBAG_MAC_HOME: ${{ github.workspace }}/target/mac-home
      # The runner is a 4-CPU VM itself: VMs with all its CPUs starve it.
      PODBAG_VM_CPUS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: podbag-vm-guest-x86_64
          path: target/vm
      - name: Build podbag with its guest
        run: |
          cargo build --release --features embed-guest
          dev/macos/sign.sh target/release/podbag
          file target/release/podbag | grep -F x86_64
      - name: Run a container in the VM
        run: |
          cpu=$(target/release/podbag run --rm mirror.gcr.io/library/alpine:3.22 uname -m)
          echo "The container runs on $cpu"
          test "$cpu" = x86_64
          target/release/podbag vm stop
      # The core of the macOS VM tests, one VM at a time. (The whole suite boots about 60
      # VMs, which is too much for this runner.)
      - name: VM tests
        timeout-minutes: 25
        env:
          PODBAG_TEST_MACOS_VM: 1
        run: >-
          cargo test --test macos_vm -- --test-threads=1 --exact
          commands_run_in_the_vm
          two_commands_share_one_vm_and_it_stops_when_idle
          only_paths_under_users_reach_the_vm
          synchronized_share_moves_edits_across_the_vm_restart
          configured_mac_folder_reaches_cli_and_docker_after_restart
          a_stopped_host_keeps_what_was_written
          a_bare_env_name_takes_the_macs_value
          the_sockets_stay_while_the_vm_is_off
          standby_uses_little_memory
          vm_stop_ends_the_standby
      - name: VM logs
        if: failure()
        run: |
          for f in "$PODBAG_MAC_HOME/console.log" "$PODBAG_MAC_HOME/run/host.log"; do
            echo "== $f"; cat "$f" || true
          done
      - name: Package the desktop app
        run: |
          dev/macos/release-files.sh
          dev/macos/check-dmg.sh target/release-files/podbag-desktop-x86_64-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-x86_64-macos
          path: target/release-files/podbag-x86_64-macos
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-desktop-x86_64-macos
          path: |
            target/release-files/podbag-desktop-x86_64-macos.zip
            target/release-files/podbag-desktop-x86_64-macos.dmg
          if-no-files-found: error

  # The Apple silicon release files: the CLI with its guest, and the desktop app. GitHub's
  # Apple silicon runners cannot start VMs, so the VM tests run on Intel only.
  macos-arm:
    name: macOS Apple silicon release files
    needs: macos-guest
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: podbag-vm-guest-aarch64
          path: target/vm
      - name: Build the release files
        run: |
          dev/macos/release-files.sh
          file target/release-files/podbag-aarch64-macos | grep -F arm64
          target/release-files/podbag-aarch64-macos --version
          codesign -d --entitlements - target/release-files/podbag-aarch64-macos |
            grep -F com.apple.security.virtualization
          dev/macos/check-dmg.sh target/release-files/podbag-desktop-aarch64-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-aarch64-macos
          path: target/release-files/podbag-aarch64-macos
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-desktop-aarch64-macos
          path: |
            target/release-files/podbag-desktop-aarch64-macos.zip
            target/release-files/podbag-desktop-aarch64-macos.dmg
          if-no-files-found: error

  # Podbag Desktop: its UI layer, its backend and the app. The tests run headless (no
  # window, no GPU).
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The Linux tray item (feature `linux-tray`, on with --all-features) builds on GTK 3.
      - name: Packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
      - name: Format
        run: cargo fmt --check -p podbag-ui -p podbag-desktop-core -p podbag-desktop
      - name: Clippy
        run: cargo clippy -p podbag-ui -p podbag-desktop-core -p podbag-desktop --all-targets --all-features --no-deps -- -D warnings
      - name: Tests
        run: cargo test -p podbag-ui -p podbag-desktop-core -p podbag-desktop --all-features
