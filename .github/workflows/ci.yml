name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README*.md', 'docs/**']
  pull_request:
    paths-ignore: ['README*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-26.04 }
          - { arch: aarch64, runner: ubuntu-26.04-arm }
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Test the release installer
        run: sh tests/install.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
          components: rustfmt
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools uidmap passt erofs-utils
          # Rootless containers need user namespaces, which Ubuntu's AppArmor restricts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          for f in /etc/subuid /etc/subgid; do
            grep -q "^$USER:" "$f" || echo "$USER:100000:65536" | sudo tee -a "$f"
          done
      - run: cargo fmt --check
      - name: Unit tests
        run: cargo test --lib --bins --test wsl
      - name: Static build
        run: |
          export "CC_${TARGET//-/_}=musl-gcc"
          cargo build --release --target "$TARGET"
          file "target/$TARGET/release/podbag"
      - name: Run containers
        run: |
          sudo install -m 0755 "target/$TARGET/release/podbag" /usr/local/bin/podbag
          podbag --version
          podbag check || true
          img=mirror.gcr.io/library/alpine:3.22
          sudo podbag run --rm "$img" echo root
          sudo podbag run --rm -v "$PWD:/src:ro" "$img" cat /src/Cargo.toml > /dev/null
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          podbag run --rm --network none "$img" echo rootless
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-${{ matrix.arch }}-linux
          path: target/${{ env.TARGET }}/release/podbag
          if-no-files-found: error

  android:
    name: Android aarch64
    runs-on: ubuntu-24.04
    env:
      TARGET: aarch64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - name: Build CLI with the Android NDK
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cargo build --locked --release --target "$TARGET" --bin podbag
          file "target/$TARGET/release/podbag" | grep -F 'interpreter /system/bin/linker64'
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-aarch64-android
          path: target/${{ env.TARGET }}/release/podbag
          if-no-files-found: error

  # The image store against the kernel: the store's integration tests and the library
  # tests that need root, rootless and as root. The container jobs run on Ubuntu 26.04:
  # rootless networks need pasta's --map-host-loopback, which 24.04's pasta lacks.
  integration:
    name: Integration ${{ matrix.mode }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        mode: [rootless, root]
    env:
      PODBAG_TEST_ROOT: ${{ matrix.mode == 'root' && '1' || '' }}
      PODBAG_TEST_ROOTFS: ${{ github.workspace }}/../alpine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Packages
        run: dev/ci/setup.sh
      - name: Test root filesystem
        run: dev/fetch-rootfs.sh "$PODBAG_TEST_ROOTFS"
      - name: Store tests
        timeout-minutes: 30
        run: cargo test --test store --test image_mount
      - name: Library tests as root
        if: matrix.mode == 'root'
        timeout-minutes: 15
        run: dev/root-lib-tests.sh

  # Real images and programs, compared with Docker: Python's .pyc files, cron, a damaged
  # file in the store.
  e2e:
    name: E2E ${{ matrix.mode }} ${{ matrix.arch }}
    needs: linux
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        mode: [rootless, root]
    env:
      PODBAG_E2E_ROOT: ${{ matrix.mode == 'root' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: podbag-${{ matrix.arch }}-linux
          path: bin
      - name: Packages
        run: dev/ci/setup.sh
      - run: sudo install -m 0755 bin/podbag /usr/local/bin/podbag
      - name: Files and repair
        timeout-minutes: 15
        run: tests/e2e/run.sh

  # nginx through podbag and through the docker CLI on podbag's Docker API.
  nginx:
    name: Nginx ${{ matrix.mode }} ${{ matrix.arch }}
    needs: linux
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        mode: [rootless, root]
    env:
      PODBAG_E2E_ROOT: ${{ matrix.mode == 'root' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: podbag-${{ matrix.arch }}-linux
          path: bin
      - name: Packages
        run: dev/ci/setup.sh
      - run: sudo install -m 0755 bin/podbag /usr/local/bin/podbag
      - name: nginx
        timeout-minutes: 10
        run: tests/e2e/nginx.sh

  windows:
    name: Windows ${{ matrix.arch }}
    needs: linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: windows-2025 }
          - { arch: aarch64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Clang for ring
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            $clang = Get-ChildItem -Recurse -Filter clang.exe -ErrorAction SilentlyContinue `
              -Path "C:\Program Files\Microsoft Visual Studio", "C:\Program Files\LLVM" |
              Select-Object -First 1
            if ($clang) { Add-Content $env:GITHUB_PATH $clang.DirectoryName }
          }
      - uses: actions/download-artifact@v4
        with:
          name: podbag-${{ matrix.arch }}-linux
          path: linux
      - name: Tests
        run: cargo test --test wsl --bin podbag
      - name: Build
        shell: pwsh
        run: |
          $env:PODBAG_LINUX_BIN = Join-Path $PWD "linux\podbag"
          cargo build --release --features embed-linux
          ./target/release/podbag.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-${{ matrix.arch }}-windows
          path: target/release/podbag.exe
          if-no-files-found: error
      - name: Test Windows desktop
        run: cargo test --locked -p podbag-desktop
      - name: Package Windows desktop
        working-directory: desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../target/windows-engine | Out-Null
          Copy-Item ../target/release/podbag.exe ../target/windows-engine/podbag.exe
          npx --yes --package @tauri-apps/cli@2.12.6 tauri build --config windows/msi.json -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-desktop-${{ matrix.arch }}-windows
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Install and open Windows desktop
        shell: pwsh
        run: |
          $msi = Get-Item target/release/bundle/msi/*.msi
          ./desktop/windows/test-installed.ps1 -Installer $msi.FullName -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-desktop-${{ matrix.arch }}-windows-screenshot
          path: target/podbag-desktop-${{ matrix.arch }}.png
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - name: Test the release installer
        run: sh tests/install.sh
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  # The Intel Mac's VM guest: an x86_64 kernel and the static podbag, built on x86_64 Linux.
  macos-guest:
    name: macOS VM guest x86_64
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update
      - name: Build the guest
        run: dev/macos/build-guest.sh
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-vm-guest-x86_64
          path: |
            target/vm/Image
            target/vm/Image.zst
            target/vm/initramfs.gz
            target/vm/disk.zst
            target/vm/arch
          if-no-files-found: error

  # podbag on an Intel Mac: containers in a real Virtualization.framework VM, and the
  # release files (the CLI with its guest, and the desktop app).
  macos-intel:
    name: macOS Intel VM
    needs: macos-guest
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      PODBAG_MAC_HOME: ${{ github.workspace }}/target/mac-home
      # The runner is a 4-CPU VM itself: VMs with all its CPUs starve it.
      PODBAG_VM_CPUS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: podbag-vm-guest-x86_64
          path: target/vm
      - name: Build podbag with its guest
        run: |
          cargo build --release --features embed-guest
          dev/macos/sign.sh target/release/podbag
          file target/release/podbag | grep -F x86_64
      - name: Run a container in the VM
        run: |
          cpu=$(target/release/podbag run --rm mirror.gcr.io/library/alpine:3.22 uname -m)
          echo "The container runs on $cpu"
          test "$cpu" = x86_64
          target/release/podbag vm stop
      # The core of the macOS VM tests, one VM at a time. (The whole suite boots about 60
      # VMs, which is too much for this runner.)
      - name: VM tests
        timeout-minutes: 25
        env:
          PODBAG_TEST_MACOS_VM: 1
        run: >-
          cargo test --test macos_vm -- --test-threads=1 --exact
          commands_run_in_the_vm
          two_commands_share_one_vm_and_it_stops_when_idle
          only_paths_under_users_reach_the_vm
          a_stopped_host_keeps_what_was_written
          a_bare_env_name_takes_the_macs_value
          the_sockets_stay_while_the_vm_is_off
          standby_uses_little_memory
          vm_stop_ends_the_standby
      - name: VM logs
        if: failure()
        run: |
          for f in "$PODBAG_MAC_HOME/console.log" "$PODBAG_MAC_HOME/run/host.log"; do
            echo "== $f"; cat "$f" || true
          done
      - name: Package the desktop app
        run: |
          desktop/bundle-macos.sh release --with-cli
          mkdir -p target/release-files
          cp target/release/podbag target/release-files/podbag-x86_64-macos
          ditto -c -k --keepParent target/release/podbag.app \
            target/release-files/podbag-desktop-x86_64-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-x86_64-macos
          path: target/release-files/podbag-x86_64-macos
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: podbag-desktop-x86_64-macos
          path: target/release-files/podbag-desktop-x86_64-macos.zip
          if-no-files-found: error

  desktop:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Tests
        run: cargo test -p podbag-desktop
      - name: Build
        run: cargo build -p podbag-desktop
